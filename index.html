<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Vencimientos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧁</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23FDF4EC%22/><text x=%2250%22 y=%2262%22 font-size=%2260%22 text-anchor=%22middle%22>🧁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --choco: #4A2F23;
    --choco-light: #7A5540;
    --frutilla: #E1495F;
    --frutilla-bg: #FBE4E7;
    --durazno: #E68A3A;
    --durazno-bg: #FCE9D4;
    --mostaza: #D6A527;
    --mostaza-bg: #FBF1D5;
    --pistacho: #6E9A5C;
    --pistacho-bg: #E4EEDD;
    --vainilla: #FDF4EC;
    --card: #FFFFFF;
    --border: #EEDFCF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  body{
    margin:0;
    background: var(--vainilla);
    font-family:'Inter', sans-serif;
    color: var(--choco);
    min-height:100vh;
    padding-bottom:90px;
  }
  header{
    padding: 20px 18px 16px;
    background: var(--choco);
    color: var(--vainilla);
    box-shadow: 0 2px 10px rgba(74,47,35,0.15);
  }
  .header-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap: 14px;
  }
  header h1{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 21px;
    margin:0;
    letter-spacing: -0.3px;
    line-height:1.25;
  }
  .header-meta{
    margin: 4px 0 0;
    font-size: 12.5px;
    opacity:0.7;
    font-weight:500;
  }
  .logout-btn{
    flex-shrink:0;
    background:none;
    border:none;
    color: var(--vainilla);
    opacity:0.65;
    font-size: 12.5px;
    font-family:'Inter', sans-serif;
    padding: 3px 2px;
    cursor:pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    margin-top: 3px;
  }
  .logout-btn:active{ opacity:1; }
  .stats{
    display:flex;
    gap:8px;
    padding: 14px 16px 4px;
  }
  .stat{
    flex:1;
    background: var(--card);
    border-radius: 14px;
    padding: 10px 8px;
    text-align:center;
    border: 1px solid var(--border);
  }
  .stat .num{
    font-family:'Fredoka', sans-serif;
    font-size: 22px;
    font-weight:600;
    line-height:1;
  }
  .stat .lbl{
    font-size: 10.5px;
    color: var(--choco-light);
    margin-top:4px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .stat.vencido .num{color:var(--frutilla);}
  .stat.hoy .num{color:var(--durazno);}
  .stat.ok .num{color:var(--pistacho);}

  main{padding: 8px 16px 16px;}

  .empty{
    text-align:center;
    padding: 60px 20px;
    color: var(--choco-light);
  }
  .empty .emoji{font-size:38px; margin-bottom:10px;}
  .empty p{font-size:14px; margin:4px 0;}

  .group-label{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--choco-light);
    margin: 18px 4px 8px;
  }

  .tag{
    position: relative;
    background: var(--card);
    border-radius: 12px;
    padding: 13px 14px 13px 18px;
    margin-bottom: 10px;
    display:flex;
    align-items:center;
    gap:12px;
    border: 1px solid var(--border);
    border-left: 5px solid var(--pistacho);
  }
  .tag::before{
    content:'';
    position:absolute;
    left: -4px;
    top: 50%;
    transform: translateY(-50%);
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--vainilla);
    border: 1.5px solid var(--border);
  }
  .tag.vencido{border-left-color: var(--frutilla);}
  .tag.hoy{border-left-color: var(--durazno);}
  .tag.pronto{border-left-color: var(--mostaza);}

  .tag-info{flex:1; min-width:0;}
  .tag-name{
    font-weight:600;
    font-size: 15px;
    margin:0 0 3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tag-meta{
    font-size: 12.5px;
    color: var(--choco-light);
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }
  .pill{
    display:inline-block;
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight:600;
  }
  .pill.vencido{background:var(--frutilla-bg); color:var(--frutilla);}
  .pill.hoy{background:var(--durazno-bg); color:var(--durazno);}
  .pill.pronto{background:var(--mostaza-bg); color:var(--mostaza);}
  .pill.ok{background:var(--pistacho-bg); color:var(--pistacho);}

  .qty{
    font-size: 12.5px;
    color: var(--choco-light);
  }

  .remove-btn{
    background: var(--vainilla);
    border: 1px solid var(--border);
    color: var(--choco-light);
    width: 34px; height:34px;
    border-radius: 10px;
    font-size: 16px;
    cursor:pointer;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .remove-btn:active{background: var(--frutilla-bg); color: var(--frutilla); border-color: var(--frutilla);}

  .fab{
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--frutilla);
    color: white;
    border:none;
    padding: 15px 28px;
    border-radius: 30px;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 15px;
    box-shadow: 0 6px 18px rgba(225,73,95,0.4);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    z-index: 20;
  }
  .fab:active{transform: translateX(-50%) scale(0.97);}

  .sheet-overlay{
    position:fixed; inset:0;
    background: rgba(74,47,35,0.4);
    z-index: 30;
    display:none;
    align-items:flex-end;
  }
  .sheet-overlay.open{display:flex;}
  .sheet{
    background: var(--vainilla);
    width:100%;
    border-radius: 22px 22px 0 0;
    padding: 20px 20px 26px;
    max-height: 88vh;
    overflow-y:auto;
    animation: slideup 0.22s ease-out;
  }
  @keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet h2{
    font-family:'Fredoka', sans-serif;
    margin:0 0 16px;
    font-size:19px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size: 12.5px;
    font-weight:600;
    color: var(--choco-light);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding: 12px 13px;
    border-radius: 11px;
    border: 1.5px solid var(--border);
    background: var(--card);
    font-size: 15px;
    font-family:'Inter', sans-serif;
    color: var(--choco);
  }
  .field input:focus{outline:none; border-color: var(--frutilla);}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1; min-width:0;}
  .row2 .field input{width:100%; min-width:0;}
  .cat-toggle{display:flex; gap:6px;}
  .cat-btn{
    flex:1;
    padding: 12px 6px;
    border-radius: 11px;
    border: 1.5px solid var(--border);
    background: var(--card);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 13px;
    color: var(--choco-light);
    cursor:pointer;
  }
  .cat-btn.active{
    background: var(--choco);
    color: var(--vainilla);
    border-color: var(--choco);
  }

  .cat-filter{
    display:flex;
    gap:8px;
    padding: 4px 16px 12px;
  }
  .cat-filter-btn{
    flex:1;
    padding: 10px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--card);
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 13.5px;
    color: var(--choco-light);
    cursor:pointer;
  }
  .cat-filter-btn.active{
    background: var(--frutilla);
    color: white;
    border-color: var(--frutilla);
  }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top: 6px;
  }
  .btn{
    flex:1;
    padding: 13px;
    border-radius: 12px;
    border:none;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 15px;
    cursor:pointer;
  }
  .btn-cancel{background: var(--card); color: var(--choco-light); border: 1.5px solid var(--border);}
  .btn-save{background: var(--frutilla); color:white;}
  .btn-save:disabled{opacity:0.5;}

  .toast{
    position:fixed;
    top: 16px; left:50%;
    transform: translateX(-50%) translateY(-60px);
    background: var(--choco);
    color: var(--vainilla);
    padding: 11px 20px;
    border-radius: 30px;
    font-size: 13.5px;
    z-index: 50;
    transition: transform 0.25s ease;
  }
  .toast.show{transform: translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="loginScreen" style="position:fixed; inset:0; background:var(--choco); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px;">
  <div style="width:100%; max-width:340px;">
    <div style="text-align:center; margin-bottom:28px;">
      <div style="font-size:40px; margin-bottom:8px;">🧁</div>
      <h1 style="font-family:'Fredoka',sans-serif; color:var(--vainilla); font-size:22px; margin:0;">Control de vencimientos</h1>
    </div>
    <div class="field">

  <div class="sheet">
    <h2 id="sheetTitle">Nuevo producto</h2>
    <div class="field">

      <datalist id="commonProducts">

    <h2>¿Retirar producto?</h2>

    <div class="sheet-actions">
      <button class="btn btn-cancel" id="confirmCancelBtn">Cancelar</button>
      <button class="btn btn-save" id="confirmOkBtn" style="background:var(--frutilla);">Sí, retirar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

</div><!-- cierre de #appRoot -->

<script>
// --- Configuración de Firebase ---
// Pegá acá el firebaseConfig que te da la consola de Firebase (Configuración del proyecto > Tus apps)
const firebaseConfig = {
  apiKey: "AIzaSyBXu6cvQhJSe3vFhpC9d4YL5QVh_8Wx7uI",
  authDomain: "control-vencimientos-rocio.firebaseapp.com",
  projectId: "control-vencimientos-rocio",
  storageBucket: "control-vencimientos-rocio.firebasestorage.app",
  messagingSenderId: "388032322310",
  appId: "1:388032322310:web:e07d756307434191f2dc87"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const productsRef = db.collection('products');
let unsubscribeProducts = null;
let products = [];
let currentCategoryFilter = 'general'; // qué pestaña se está viendo: 'general' o 'torta'

// Nota: ya no hay funciones separadas de "cargar" y "guardar" en bloque —
// cada alta/edición/borrado habla directo con Firestore (ver más abajo),
// y la suscripción en tiempo real (suscribirseAProductos) mantiene todo actualizado solo.

function daysUntil(dateStr){
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

// La fecha de retiro es un día antes de la fecha impresa en la etiqueta
function retiroDate(expDateStr){
  const d = new Date(expDateStr + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0,10);
}

function fmtFecha(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'});
}

function mostrarFechaHoy(){
  const hoy = new Date();
  const texto = hoy.toLocaleDateString('es-AR', {weekday:'long', day:'2-digit', month:'long'});
  document.getElementById('todayDate').textContent = texto.charAt(0).toUpperCase() + texto.slice(1);
}

function fmtDias(d){
  if(d === -1) return 'Retirar hoy (atrasado 1 día)';
  if(d < 0) return `Debería estar retirado (hace ${Math.abs(d)} día${Math.abs(d)===1?'':'s'})`;
  if(d === 0) return 'Retirar hoy';
  if(d === 1) return 'Retirar mañana';
  return `Retirar en ${d} días`;
}

// dVenc = días hasta la fecha real de vencimiento (la de la etiqueta)
// dRetiro = días hasta la fecha en la que hay que retirarlo (un día antes)
function estadoUrgencia(dVenc, dRetiro){
  if(dVenc < 0) return 'vencido';           // ya pasó la fecha real de vencimiento -> rojo
  if(dRetiro <= 0) return 'hoy';            // hay que retirarlo hoy (o ya se pasó el día de retiro) -> naranja
  if(dRetiro <= 2) return 'pronto';         // se retira en 1-2 días -> amarillo
  return 'ok';                              // todavía queda margen -> verde
}

// Se suscribe a la colección de Firestore: cada cambio (propio o de otro celular)
// llega acá solo, en tiempo real, sin que nadie tenga que refrescar nada.
function suscribirseAProductos(){
  if(unsubscribeProducts) unsubscribeProducts();
  unsubscribeProducts = productsRef.onSnapshot(
    (snapshot) => {
      products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      render();
    },
    (error) => {
      showToast('No se pudo conectar con la base de datos');
      console.error(error);
    }
  );
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1800);
}

function render(){
  const main = document.getElementById('main');
  const enCategoria = products.filter(p => (p.category || 'general') === currentCategoryFilter);
  const sorted = [...enCategoria].sort((a,b)=> daysUntil(retiroDate(a.expDate)) - daysUntil(retiroDate(b.expDate)));

  const vencidos = sorted.filter(p => daysUntil(p.expDate) < 0).length;
  const hoy = sorted.filter(p => estadoUrgencia(daysUntil(p.expDate), daysUntil(retiroDate(p.expDate))) === 'hoy').length;
  document.getElementById('statVencido').textContent = vencidos;
  document.getElementById('statHoy').textContent = hoy;
  document.getElementById('statOk').textContent = sorted.length;
  document.getElementById('subtitle').textContent = sorted.length
    ? ` · ${sorted.length} producto${sorted.length===1?'':'s'} en mostrador`
    : ' · Sin productos cargados';

  if(sorted.length === 0){
    main.innerHTML = `<div class="empty"><div class="emoji">🍞</div><p><strong>No hay productos cargados.</strong></p><p>Tocá "Cargar producto" para empezar.</p></div>`;
    return;
  }

  let html = '';
  let lastGroup = null;
  sorted.forEach(p => {
    const rDate = retiroDate(p.expDate);
    const d = daysUntil(rDate);
    const dVenc = daysUntil(p.expDate);
    const estado = estadoUrgencia(dVenc, d);
    const group = estado === 'vencido' ? 'Vencidos'
      : estado === 'hoy' ? 'Retirar hoy'
      : estado === 'pronto' ? 'Por retirar pronto'
      : 'En stock';
    if(group !== lastGroup){
      html += `<div class="group-label">${group}</div>`;
      lastGroup = group;
    }
    html += `
      <div class="tag ${estado === 'ok' ? '' : estado}">
        <div class="tag-info">
          <p class="tag-name">${escapeHtml(p.name)}</p>
          <div class="tag-meta">
            <span class="pill ${estado}">${fmtDias(d)}</span>
          </div>
          <div class="tag-meta" style="margin-top:3px;">
            <span class="qty">Etiqueta: ${fmtFecha(p.expDate)} · Retirar: ${fmtFecha(rDate)}</span>
          </div>
          ${p.notes ? `<div class="tag-meta" style="margin-top:5px; background:var(--vainilla); padding:6px 9px; border-radius:8px; color:var(--choco-light); font-style:italic;">📝 ${escapeHtml(p.notes)}</div>` : ''}
        </div>
        <button class="remove-btn" onclick="editProduct('${p.id}')" title="Editar producto" style="margin-right:-2px;">✎</button>
        <button class="remove-btn" onclick="askRemoveConfirm('${p.id}')" title="Retirar del mostrador">✕</button>
      </div>`;
  });
  main.innerHTML = html;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

let pendingRemoveId = null;

function askRemoveConfirm(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  pendingRemoveId = id;
  document.getElementById('confirmMsg').textContent = `Vas a sacar "${p.name}" de la lista.`;
  document.getElementById('confirmOverlay').classList.add('open');
}
window.askRemoveConfirm = askRemoveConfirm;

document.getElementById('confirmCancelBtn').onclick = () => {
  pendingRemoveId = null;
  document.getElementById('confirmOverlay').classList.remove('open');
};

document.getElementById('confirmOkBtn').onclick = async () => {
  document.getElementById('confirmOverlay').classList.remove('open');
  if(pendingRemoveId){
    await removeProduct(pendingRemoveId);
    pendingRemoveId = null;
  }
};

async function removeProduct(id){
  try{
    await productsRef.doc(id).delete();
    showToast('Producto retirado');
  }catch(e){
    showToast('No se pudo borrar. Revisá tu conexión');
  }
}

// Sheet handling
const overlay = document.getElementById('overlay');
let editingId = null; // null = cargando producto nuevo, sino = editando ese id

let selectedCategory = 'general'; // categoría elegida en el formulario que está abierto

function setSelectedCategory(cat){
  selectedCategory = cat;
  document.getElementById('catGeneralBtn').classList.toggle('active', cat === 'general');
  document.getElementById('catTortaBtn').classList.toggle('active', cat === 'torta');
}
document.getElementById('catGeneralBtn').onclick = () => setSelectedCategory('general');
document.getElementById('catTortaBtn').onclick = () => setSelectedCategory('torta');

document.getElementById('openSheet').onclick = () => {
  editingId = null;
  document.getElementById('sheetTitle').textContent = 'Nuevo producto';
  document.getElementById('saveBtn').textContent = 'Guardar';
  document.getElementById('deleteFromSheetBtn').style.display = 'none';
  document.getElementById('fName').value = '';
  document.getElementById('fDate').value = '';
  document.getElementById('fNotes').value = '';
  setSelectedCategory(currentCategoryFilter); // arranca en la misma pestaña que estás viendo
  overlay.classList.add('open');
};

function editProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  editingId = id;
  document.getElementById('sheetTitle').textContent = 'Editar producto';
  document.getElementById('saveBtn').textContent = 'Guardar cambios';
  document.getElementById('deleteFromSheetBtn').style.display = 'block';
  document.getElementById('fName').value = p.name;
  document.getElementById('fDate').value = p.expDate;
  document.getElementById('fNotes').value = p.notes || '';
  setSelectedCategory(p.category || 'general');
  overlay.classList.add('open');
}
window.editProduct = editProduct;

document.getElementById('deleteFromSheetBtn').onclick = () => {
  if(!editingId) return;
  overlay.classList.remove('open');
  askRemoveConfirm(editingId);
};

document.getElementById('cancelBtn').onclick = () => overlay.classList.remove('open');
overlay.onclick = (e) => { if(e.target === overlay) overlay.classList.remove('open'); };

document.getElementById('saveBtn').onclick = async () => {
  const name = document.getElementById('fName').value.trim();
  const date = document.getElementById('fDate').value;
  const notes = document.getElementById('fNotes').value.trim();
  if(!name || !date){
    showToast('Falta nombre o fecha de vencimiento');
    return;
  }
  try{
    if(editingId){
      await productsRef.doc(editingId).update({ name, category: selectedCategory, expDate: date, notes });
      overlay.classList.remove('open');
      showToast('Producto actualizado');
    } else {
      await productsRef.add({ name, category: selectedCategory, expDate: date, notes });
      overlay.classList.remove('open');
      showToast('Producto cargado');
    }
  }catch(e){
    showToast('No se pudo guardar. Revisá tu conexión');
  }
};

// --- Login ---
const loginScreen = document.getElementById('loginScreen');
const appRoot = document.getElementById('appRoot');

document.getElementById('loginBtn').onclick = async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';
  if(!email || !pass){
    errorEl.textContent = 'Completá usuario y contraseña';
    return;
  }
  try{
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(e){
    errorEl.textContent = 'Usuario o contraseña incorrectos';
  }
};

document.getElementById('logoutBtn').onclick = () => auth.signOut();

document.getElementById('filterGeneralBtn').onclick = () => {
  currentCategoryFilter = 'general';
  document.getElementById('filterGeneralBtn').classList.add('active');
  document.getElementById('filterTortaBtn').classList.remove('active');
  render();
};

document.getElementById('filterTortaBtn').onclick = () => {
  currentCategoryFilter = 'torta';
  document.getElementById('filterTortaBtn').classList.add('active');
  document.getElementById('filterGeneralBtn').classList.remove('active');
  render();
};

// Reacciona automáticamente cuando alguien entra o sale de sesión
auth.onAuthStateChanged((user) => {
  if(user){
    loginScreen.style.display = 'none';
    appRoot.style.display = 'block';
    mostrarFechaHoy();
    suscribirseAProductos();
  } else {
    if(unsubscribeProducts){ unsubscribeProducts(); unsubscribeProducts = null; }
    appRoot.style.display = 'none';
    loginScreen.style.display = 'flex';
    document.getElementById('loginPass').value = '';
  }
});

// Recalcula "días para retirar" apenas cambia el día (esto es un cálculo local,
// no consulta al servidor, así que no tiene costo dejarlo corriendo)
let lastCheckedDay = new Date().getDate();
setInterval(() => {
  const nowDay = new Date().getDate();
  if(nowDay !== lastCheckedDay){
    lastCheckedDay = nowDay;
    mostrarFechaHoy();
    render();
  }
}, 30000);
</script>
